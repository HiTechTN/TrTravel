name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Disable analytics
        run: flutter --disable-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5

  release:
    name: Upload APK to Release
    needs: build-android
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./artifacts

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/app-release.apk
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Post Release Summary
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Comment on release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release.tag_name;
            const version = tag.replace('v', '');
            const apkUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/app-release.apk`;
            
            const body = `## 📱 TrTravel ${tag}\n\n` +
              `### Téléchargement\n` +
              `- [**APK Release**](${apkUrl}) — ${version}\n\n` +
              `### Nouveautés\n` +
              `${context.payload.release.body || '_Voir les notes de release._'}\n\n` +
              `### Installation\n` +
              `1. Téléchargez l'APK ci-dessus\n` +
              `2. Activez "Sources inconnues" dans les paramètres Android\n` +
              `3. Installez l'application`;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: body
            });
            
            core.info(`Release ${tag} updated with download link and install instructions`);
