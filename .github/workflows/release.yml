name: Build and Release

on:
  push:
    branches: [main, master, feature/v3.1.0-sync-cloud, feature/v3.1.0-share-itinerary, feature/v3.1.0-collaboration-mode, feature/v3.1.0-smart-notifications, feature/v3.2.0-augmented-reality, feature/v3.2.0-bookings-integration, feature/v3.2.0-expense-tracking, feature/v3.2.0-voice-journal, feature/v4.0.0-ai-assistant, feature/v4.0.0-cross-platform, feature/v4.0.0-offline-mode, feature/v4.0.0-ui-redesign]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Disable analytics
        run: flutter --disable-analytics

      - name: Populate Firebase config
        run: |
          chmod +x scripts/populate_google_services.sh
          bash scripts/populate_google_services.sh
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: List build outputs
        run: ls -la build/app/outputs/flutter-apk/

      - name: Verify APK artifacts exist
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi
          if [ ! -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "ERROR: Debug APK not found!"
            exit 1
          fi
          echo "Both APKs verified successfully"
          echo "Release APK size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          echo "Debug APK size: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  release:
    name: Upload APK to Release
    needs: [build-android, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./artifacts

      - name: Verify downloaded artifact
        run: |
          if [ ! -f ./artifacts/app-release.apk ]; then
            echo "ERROR: Downloaded release APK not found!"
            exit 1
          fi
          echo "Release APK ready for upload: $(du -h ./artifacts/app-release.apk | cut -f1)"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/app-release.apk
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Post Release Summary
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      issues: write

    steps:
      - name: Comment on release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release.tag_name;
            const version = tag.replace('v', '');
            const apkUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/app-release.apk`;

            const body = `## 📱 TrTravel ${tag}\n\n` +
              `### Téléchargement\n` +
              `- [**APK Release**](${apkUrl}) — ${version}\n\n` +
              `### Nouveautés\n` +
              `${context.payload.release.body || '_Voir les notes de release._'}\n\n` +
              `### Installation\n` +
              `1. Téléchargez l'APK ci-dessus\n` +
              `2. Activez "Sources inconnues" dans les paramètres Android\n` +
              `3. Installez l'application`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: body
            });

            core.info(`Release ${tag} updated with download link and install instructions`);
