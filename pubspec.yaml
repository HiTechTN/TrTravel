name: trtravel
description: A travel application for Turkey trip with offline maps and journal.
publish_to: 'none'
version: 4.0.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^10.1.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.7
  json_annotation: ^4.9.0
  http: ^1.2.2
  geolocator: ^14.0.3
  connectivity_plus: ^7.2.0
  sqflite: ^2.3.0
  flutter_tts: ^4.0.0
  cached_network_image: ^3.3.0
  sqflite_common_ffi: ^2.3.0
  permission_handler: ^12.0.3
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.0.0
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.7
  cloud_firestore: ^6.6.0
  google_mlkit_translation: ^0.13.1
  share_plus: ^13.2.0
  url_launcher: ^6.0.0
  flutter_linkify: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/itinerary.json
    - assets/images/
    - assets/maps/