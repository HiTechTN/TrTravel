name: trtravel
description: A travel application for Turkey trip with offline maps and journal.
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^9.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  json_annotation: ^4.9.0
  http: ^1.2.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.1
  sqflite: ^2.4.1
  flutter_tts: ^4.2.0
  cached_network_image: ^3.4.1
  sqflite_common_ffi: ^2.3.4+5
  permission_handler: ^11.3.1
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  firebase_messaging: ^14.7.10
  firebase_core: ^2.32.0
  url_launcher: ^6.3.1
  flutter_linkify: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/itinerary.json
    - assets/images/
    - assets/maps/